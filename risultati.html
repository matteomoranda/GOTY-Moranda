<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Risultati form</title>
        <link rel="stylesheet" href="stile.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="immagini\GOTY-logo.png">
        <script src="script.js" defer></script>
        <script src="https://kit.fontawesome.com/6f4b1e041f.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <header>
            <nav>
                <a href="javascript:history.back()">
                    <span style="font-size: 24px; vertical-align: middle;">&#8592;</span>
                </a>
            </nav>
        </header>

        <main>
            <div class="pulse-wrapper">
                <h2 id="grazie">Recensione del gioco</h2>
            </div>
            <div id="output" class="card"></div>
        </main>

        <footer>
            <div class="feedback-footer">
                <span>Aiutaci a migliorare, lascia una recensione del sito →</span>
                <button id="reviewBtn">⭐ Lascia recensione</button>
            </div>

            <div id="reviewPopup" class="popup">
                <h3>Valuta il sito</h3>
                <div class="stars">
                    <span class="star" data-value="1">☆</span>
                    <span class="star" data-value="2">☆</span>
                    <span class="star" data-value="3">☆</span>
                    <span class="star" data-value="4">☆</span>
                    <span class="star" data-value="5">☆</span>
                </div>
                <button id="closePopup">Chiudi</button>
            </div>
        </footer>


    </body>
</html>
